<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div>
    <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  </div>
  <button id="btn">点击我恢复</button>
  <script>
    /**
     * 状态保存与回复
     * ctx.save()
     * ctx.restore()
     */
    const cnv = document.getElementById('canvas');
    const ctx = cnv.getContext('2d');

    // 绘制一个圆形
    ctx.beginPath();
    ctx.arc(500, 500, 200, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = 'red';
    ctx.fill();

    // 保存状态
    ctx.save();

    // 剪切
    ctx.clip();

    // 绘制一个矩形
    ctx.beginPath();
    ctx.rect(200, 200, 400, 400);
    ctx.closePath();
    ctx.fillStyle = 'blue';
    ctx.fill();

    // 点击按钮回复状态并重绘
    document.getElementById('btn').addEventListener('click', function() {
      // 恢复状态
      ctx.restore();
      // 重绘矩形
      ctx.beginPath();
      ctx.rect(200, 200, 400, 400);
      ctx.closePath();
      ctx.fillStyle = 'skyblue';
      ctx.fill();
    });



  </script>
</body>
</html>
