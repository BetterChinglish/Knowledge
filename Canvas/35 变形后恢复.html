<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div>
    <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  </div>
  <button id="btn">点击我恢复</button>
  <script>
    const cnv = document.getElementById('canvas');
    const ctx = cnv.getContext('2d');

    // 保存当前状态
    ctx.save();

    ctx.translate(50, 50);

    ctx.fillStyle = 'skyblue';
    ctx.fillRect(0, 0,50 ,40);

    // 平移后再恢复
    ctx.restore();

    // 确保 pink 矩形的左上角坐标是 (40, 40)
    ctx.translate(40, 40);
    ctx.fillStyle = 'pink';
    ctx.fillRect(0, 0,50 ,40);

  </script>
</body>
</html>
