<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div>
    <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  </div>
  <script>
    const cnv = document.getElementById('canvas');
    const ctx = cnv.getContext('2d');

    // 默认，新图像覆盖旧图像
    ctx.globalCompositeOperation = 'source-over';

    // 只显示新图形，旧图形作透明处理
    ctx.globalCompositeOperation =  'copy';

    // 两种图形都显示，在重叠部分，颜色由两种图形的颜色值相减后形成
    ctx.globalCompositeOperation =  'darker';

    // 只显示新图形与旧图形重叠部分以及新图形的其余部分，其他部分作透明处理
    ctx.globalCompositeOperation =  'destination-atop';

    // 只显示旧图形中与新图形重叠部分，其他部分作透明处理
    ctx.globalCompositeOperation =  'destination-in';

    // 只显示旧图形中与新图形不重叠部分，其他部分作透明处理
    ctx.globalCompositeOperation =  'destination-out';

    // 与 source-over属性相反，旧图形覆盖新图形
    ctx.globalCompositeOperation =  'destination-over';

    // 两种图形都显示，在图形重叠部分，颜色由两种图形的颜色值相加后形成
    ctx.globalCompositeOperation =  'lighter';

    // 只显示旧图形与新图形重叠部分及旧图形的其余部分，其他部分作透明处理
    ctx.globalCompositeOperation =  'source-atop';

    // 只显示新图形中与旧图形重叠部分，其他部分作透明处理
    ctx.globalCompositeOperation =  'source-in';

    // 只显示新图形中与旧图形不重叠部分，其他部分作透明处理
    ctx.globalCompositeOperation =  'source-out';

    // 两种图形都绘制，其中重叠部分作透明处理
    ctx.globalCompositeOperation =  'xor';

    // 不用记忆，了解即可，记住有globalCompositeOperation属性即可

  </script>
</body>
</html>
