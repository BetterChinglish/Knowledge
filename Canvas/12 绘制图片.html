<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  <img src="https://www.baidu.com/img/PCtm_d9c8750bed0b3c7d089fa7d55720d6cf.png" alt="">
  <script>
    /**
     * 绘制图片
     * 
     * drawImage(img, x, y): 绘制图片的原始大小
     * img: 要绘制的图片
     * x: 图片在 canvas 中的 x 坐标
     * y: 图片在 canvas 中的 y 坐标
     * 
     * drawImage(img, x, y, width, height): 绘制图片的指定大小(缩放)
     * img: 要绘制的图片
     * x: 图片在 canvas 中的 x 坐标
     * y: 图片在 canvas 中的 y 坐标
     * width: 图片在 canvas 中的宽度
     * height: 图片在 canvas 中的高度
     * 
     * drawImage(img, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight): 绘制图片的指定区域(缩放)
     * img: 要绘制的图片
     * sx: 图片中要绘制的区域的 x 坐标
     * sy: 图片中要绘制的区域的 y 坐标
     * sWidth: 图片中要绘制的区域的宽度
     * sHeight: 图片中要绘制的区域的高度
     * dx: 图片在 canvas 中的 x 坐标
     * dy: 图片在 canvas 中的 y 坐标
     * dWidth: 图片在 canvas 中的宽度
     * dHeight: 图片在 canvas 中的高度
     * 
     */ 
    const cnv = document.getElementById('canvas');
    const ctx = cnv.getContext('2d');

    window.onload = function() {
      const img = document.querySelector('img');

      // 绘制图片的原始大小
      ctx.drawImage(img, 0, 0);

      const imgWidth = img.naturalWidth;
      const imgHeight = img.naturalHeight;
      
      // 等比例缩小 - 固定宽度为200px
      let fixedWidth = 200;
      ctx.drawImage(img, 300, 300, fixedWidth, Math.floor(fixedWidth / imgWidth * imgHeight));

      // 绘制图片的指定区域(缩放)
      ctx.drawImage(img, 200, 200, 500, 500, 500, 500, 250, 250);
      
    }

  </script>
</body>
</html>
