<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div>
    <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  </div>
  原始图片:
  <img src="https://www.baidu.com/img/PCtm_d9c8750bed0b3c7d089fa7d55720d6cf.png" alt="">
  <script>
    /**
     * 切割图片
     * ctx.clip()
     * 切割图片后，只能绘制在切割区域内
     */

     
    window.onload = function() {
      const cnv = document.getElementById('canvas');
      const ctx = cnv.getContext('2d');
      const img = document.querySelector('img');

      // 1 绘制切割区域
      ctx.beginPath();
      ctx.moveTo(200, 200);
      ctx.lineTo(800, 200);
      ctx.lineTo(800, 800);
      ctx.lineTo(200, 800);
      ctx.closePath();
      ctx.stroke();
      
      // 2 设置切割区域
      ctx.clip();

      // 3 绘制切割后的图片
      ctx.drawImage(img, 50, 50);
      // 其实图片绘制在 canvas 坐标 (50, 50) 开始的位置
      // 而只有clip设置的区域能看见绘制的图片

      // 结束切割
      ctx.restore();

     }
  </script>
</body>
</html>
