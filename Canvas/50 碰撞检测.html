  /*
  * 外接矩形判定法:
  * 将物体近似抽象为一个矩形,用一个最小的能够完全罩住物体的矩形来代表物体本身, 然后判断矩形是否碰撞即可.
  * 问题便被转化为两个矩形碰撞如何检测的问题, 检测方式如下函数
  * */
  function checkRect(A, B) {
    return !(
      A.x + A.width < B.x ||
      B.x + B.width < A.x ||
      A.y + A.height < B.y ||
      B.y + B.height < A.y
    )
  }


  /*
  * 外接圆判定法:
  * 将物体抽象为一个近似圆, 则问题简化为两个圆碰撞如何检测的问题, 检测方式如下函数
  * */
  function checkCircle(A, B) {
    const dx = A.x - B.x;
    const dy = A.y - B.y;
    const distance = dx * dx + dy * dy;
    return distance < Math.pow(A.radius + B.radius, 2);
  }
