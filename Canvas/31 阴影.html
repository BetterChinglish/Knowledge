<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div>
    <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  </div>
  <script>
    /**
     * 阴影
     * 
     * 常见的阴影属性：
     *  shadowColor： 阴影的颜色，默认黑色
     *  shadowBlur： 阴影的模糊程度，默认为0，越大越模糊
     *  shadowOffsetX： 阴影在水平方向上的偏移量。可以为负数
     *  shadowOffsetY： 阴影在垂直方向上的偏移量。可以为负数
     * 
    */

    const cnv = document.getElementById('canvas');
    const ctx = cnv.getContext('2d');

    ctx.fillStyle = 'red';
    ctx.fillRect(100, 100, 200, 200);


    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetX = 10;
    ctx.shadowOffsetY = 10;

    ctx.fillStyle = 'green';
    ctx.fillRect(200, 200, 200, 200);


    // 文字阴影
    ctx.fillStyle = 'skyblue';
    ctx.font = '100px serif';
    // 文字阴影
    ctx.shadowColor = 'blue';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetX = 10;
    ctx.shadowOffsetY = 10;
    ctx.fillText('hello world', 100, 700);

    // 四个方向的阴影
    ctx.shadowColor = 'pink';
    ctx.shadowBlur = 15;
    // 只需要将阴影的偏移量设置为0，就可以实现四个方向的阴影
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillText('hello world', 700, 300);

    ctx.fillRect(600, 100, 100, 100)
     
  

  </script>
</body>
</html>
