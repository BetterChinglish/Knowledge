<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h3>图形平移属于变形操作, 其他变形操作包括缩放, 旋转, 变换矩阵</h3>
  <h4>要点概括</h4>
  <ul>
    <li>平移：translate(x, y)</li>
    <li>缩放: scale(x, y)</li>
    <li>旋转: rotate(angle)</li>
    <li>变换矩阵: transform(), setTransform()</li>
  </ul>
  <div style="margin: 20px 0 0 0;">这里展示了旋转操作的效果</div>
  <div>

  </div>
  <div>
    <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  </div>
  <script>
    /**
     * 旋转: rotate(angle)
     * 
     * angle: 旋转角度, 单位为弧度
     * 大于0: 顺时针旋转
     * 小于0: 逆时针旋转
     * 
     * 参考坐标系: w3c坐标系
     * 
     * */ 

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = 'red';
    ctx.fillRect(100, 100, 100, 100);

    const OneDegree = Math.PI / 180;

    // 顺时针旋转20度
    ctx.rotate(20 * OneDegree);

    ctx.fillStyle = 'skyblue';
    // 可以看到,旋转中心是坐标系原点
    ctx.fillRect(100, 100, 100, 100);

    // 可以看到, 其实rotate是将当前坐标系进行旋转
    ctx.fillRect(200, 200, 100, 100);

    // 恢复到初始坐标系
    ctx.rotate(-20 * OneDegree);

    // 可以看到, 旋转后, 坐标系回到了初始状态
    ctx.fillRect(300, 300, 100, 100);

    // 改变旋转中心
    // 可以使用translate()将原点移动到需要的位置, 再旋转坐标系
    ctx.translate(350, 350);
    ctx.rotate(45 * OneDegree);
    ctx.fillStyle = 'green';
    ctx.fillRect(-50, -50, 100, 100);

  </script>
</body>
</html>
