<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div style="margin: 0 0 20px 0;">
    原始图片
    <img src="./pic.png" alt="" style="width: 1000px; height: 1000px;">
  </div>
  <div>
    <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  </div>
  <script>
    const cnv = document.getElementById('canvas');
    const ctx = cnv.getContext('2d');

    const img = new Image();
    img.src = './pic.png';
    img.onload = function() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(img, 0, 0);
      // 平移图片
      ctx.translate(300, 300);
      ctx.drawImage(img, 0, 0);
    }
    const text = 'Hello, Canvas!';
    ctx.font = '30px serif';
    ctx.fillStyle = 'red';
    ctx.fillText(text, 600, 100);

    const OneDegree = Math.PI / 180;
    // 旋转文字
    ctx.rotate(10 * OneDegree);
    ctx.fillStyle = 'skyblue';
    ctx.fillText(text, 600, 100);
    

  </script>
</body>
</html>
