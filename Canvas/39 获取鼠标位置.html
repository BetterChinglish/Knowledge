<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;

    }
    .example {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="example">
    <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
  </div>

  <div>
    <p class="mousePlace"></p>
  </div>
  <script>
    const cnv = document.getElementById('canvas');
    const ctx = cnv.getContext('2d');

    // 获取鼠标相对于canvas的位置
    cnv.addEventListener('mousemove', (e) => {
      const x = e.clientX - cnv.offsetLeft;
      const y = e.clientY - cnv.offsetTop;
      // 显示鼠标位置
      document.querySelector('.mousePlace').innerHTML = `鼠标位置：${x}, ${y}`;
    })


  </script>
</body>
</html>
