<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    .example {
      padding: 300px 0 0 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      /* 关键：强制 canvas 元素本身宽度与属性 width 一致，避免被 CSS 缩放 */
      width: 1000px;
      height: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
<div class="example">
  <canvas id="canvas" width="1000" height="1000" style="border: 1px solid #000;"></canvas>
</div>
<script>
  // 做动画效果，一般不使用setInterval，其本身存在一些性能问题，且无法准确控制动画帧的频率
  /*
  * 使用requestAnimationFrame(): 请求动画帧
  *
  * 语法：
  *   requestAnimationFrame(callback)
  *
  * */


  const cnv = document.getElementById('canvas');
  const ctx = cnv.getContext('2d');

  // 常用格式：
  /*
  (
    function frame() {
      window.requestAnimationFrame(frame);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // ...
    }
  ) ()
  */

  // 兼容性问题处理, 没多大必要, 了解即可, 除特殊行业特殊用途, 用不了的一律建议升级设备
  /*window.requestAnimationFrame = (
    window.requestAnimationFrame ||
      window.webkitRequestAnimationFrame ||
      window.mozRequestAnimationFrame ||  // Firefox
      window.msRequestAnimationFrame ||   // IE
      window.oRequestAnimationFrame ||    // Opera
      function (callback) {
        return window.setTimeout(callback, 1000 / 60);
      }
  )*/

  /* 运动的半圆 */
  /*let x = 0;
  const degree = Math.PI / 180;

  (function frame() {
    if(x > cnv.width) {
      x = 0;
    }

    window.requestAnimationFrame(frame);

    ctx.clearRect( 0, 0, cnv.width, cnv.height );

    // 绘制一个圆
    ctx.beginPath();
    ctx.arc(x, 500, 50, 0, degree * 180, true);
    ctx.fillStyle = 'skyblue';
    ctx.fill();

    x++;
  })()*/

  // 按圆形轨迹运动

  const r = 300;
  let angle = 0;
  const degree = Math.PI / 180;
  function drawTrail() {
    // 画一个虚线圆形作为路径
    ctx.beginPath();
    ctx.setLineDash([10, 15]);
    ctx.arc(cnv.width / 2, cnv.height / 2, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'lightgray';
    ctx.stroke();
    ctx.setLineDash([]); // 清除虚线设置
  }

  (function frame2() {
    window.requestAnimationFrame(frame2);

    ctx.clearRect(0, 0, cnv.width, cnv.height);

    drawTrail();

    const x = cnv.width / 2 + r * Math.cos(angle * degree);
    const y = cnv.height / 2 + r * Math.sin(angle * degree);

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'pink';
    ctx.fill();

    angle += 0.2;
    if(angle >= 360) {
      angle = 0;
    }
  })()

</script>
</body>
</html>
